# Every Monday, checks the links of the site to other sites and keeps one issue up to date with
# the broken ones (partner pages link to many external resources, which move or disappear).
# It never blocks a pull request.
name: links

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress "docs/**/*.md"
          output: lychee/report.md
          fail: false
      - name: Open or update the issue of broken links
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Broken external links"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file lychee/report.md
          else
            gh issue create --title "$title" --body-file lychee/report.md
          fi
