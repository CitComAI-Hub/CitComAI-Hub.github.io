# Builds the site in strict mode on every pull request: broken links and warnings fail the check
name: check

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache/restore@v6
        with:
          path: .cache
          key: zensical-${{ hashFiles('pyproject.toml', 'zensical.toml') }}
          restore-keys: zensical-
      - run: pip install -e .
      - run: zensical build --strict
