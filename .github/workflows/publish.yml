# Builds the site on every push to main and publishes it on GitHub Pages
# (Settings → Pages → Source: GitHub Actions).
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push does not cancel one that is running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: the date and authors of each page come from git
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Build cache, with the external assets that the privacy plugin downloads
      - uses: actions/cache@v6
        with:
          path: .cache
          key: zensical-${{ hashFiles('pyproject.toml', 'zensical.toml') }}
          restore-keys: zensical-
      - run: pip install -e .
      - run: zensical build --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
