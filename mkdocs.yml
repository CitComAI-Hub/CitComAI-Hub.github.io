site_name: CitCom<sup>AI</sup> Hub
site_url: https://citcomai-hub.github.io
repo_url: https://github.com/CitComAI-Hub/CitComAI-Hub.github.io
edit_uri: edit/main/docs/
repo_name: CitComAI-Hub/CitComAI-Hub.github.io
copyright: Copyright &copy; 2023 - 2026 CitCom.ai Hub
site_dir: public
extra_javascript:
  - javascripts/external-links.js
extra_css:
  - stylesheets/extra.css
  - stylesheets/citcom.css
  - assets/css/ai_assess_catalog.css
theme:
  custom_dir: docs/overrides
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Barlow
    code: JetBrains Mono
  features:
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
not_in_nav: |
  /data_spaces/eclipse/architecture.md
  /data_spaces/eclipse/deployment.md
nav:
  - Home: index.md
  - Get started:
      - getting_started/index.md
      - The project and the TEFs: getting_started/project.md
      - Interoperability: getting_started/interoperability.md
      - Data spaces in 5 minutes: getting_started/data_spaces.md
  - Data space:
      - data_spaces/index.md
      - How it works: data_spaces/fiware.md
      - Marketplace: marketplace/index.md
      - Eclipse EDC data space: data_spaces/eclipse/index.md
  - Guides:
      - guides/index.md
      - "Example: MIAIS, an AI service": miais/index.md
      - "Example: Valencia, a city platform": valencia/index.md
      - Join the data space: guides/join.md
      - Deploy your own connector: guides/deploy_connector.md
      - Get a wallet and your credentials: guides/wallet.md
      - Use data from your code: guides/consume_data.md
      - Publish a dataset: guides/publish_dataset.md
      - Publish a web service: guides/publish_service.md
  - Toolbox:
      - toolbox/index.md
      - Lepus: toolbox/lepus.md
      - NGSI-LD and FiLiP: toolbox/ngsi_ld.md
      - ds-consumer-auth: toolbox/ds_consumer_auth.md
      - Wallets: toolbox/wallets.md
      - Smart Data Models: toolbox/smart_data_models.md
      - More tools:
          - AI Toolkit: toolbox/ai_toolkit.md
          - AI Logging Monitor: toolbox/ai_logging_monitor.md
          - MIMs Toolkit: toolbox/mims_toolkit.md
          - LDT Toolkit: toolbox/ldt_toolkit.md
          - FIWARE IoT Agent: toolbox/iot_agent.md
          - Other tools: toolbox/other_toolkit.md
  - TEF network:
      - tef/index.md
      - Nordic - POWER:
          - tef/nordic_power/doll_living_lab.md
          - tef/nordic_power/aarhus_city_lab.md
          - tef/nordic_power/net_zero_innovation_hub.md
          - tef/nordic_power/dti.md
          - tef/nordic_power/center_denmark.md
          - tef/nordic_power/gate21.md
          - tef/nordic_power/rise.md
          - tef/nordic_power/tampere.md
      - Central - MOVE:
          - tef/central_move/mechelen.md
          - tef/central_move/brussels.md
          - tef/central_move/eindhoven.md
          - tef/central_move/paris.md
          - tef/central_move/list.md
      - South - CONNECT:
          - tef/south_connect/valencia.md
          - tef/south_connect/milano.md
          - tef/south_connect/warsaw.md
      - AI Trustworthiness Label:
          - ai_assessment/index.md
          - ai_assessment/ai_assessment_catalogue.md
      - Local Digital Twins: local_digital_twins/index.md
  - Help:
      - faq/index.md
      - Request changes: faq/pull_request_procedure.md
markdown_extensions:
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
plugins:
  - git-authors:
      show_email_address: false
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - macros
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - skip-glightbox
      auto_caption: false
      caption_position: bottom
      background: white
      shadow: true
      manual: false
  - redirects:
      redirect_maps:
        welcome.md: getting_started/index.md
        getting_started/nodes_countries.md: tef/index.md
        getting_started/data_spaces/fundaments_deployment.md: getting_started/data_spaces.md
        getting_started/get_involved/index.md: guides/join.md
        getting_started/get_involved/join.md: guides/join.md
        data_catalog/index.md: marketplace/index.md
        data_catalog/instructions.md: marketplace/index.md
        "data_catalog/metadata_datasets/nordic_citcom_gtm.md": marketplace/index.md
        "data_catalog/metadata_datasets/north_center denmark_center denmark.md": marketplace/index.md
        "data_catalog/metadata_datasets/south_italy_mithraeum-of-circus-maximus.md": marketplace/index.md
        "data_catalog/metadata_datasets/south_italy_uptown.md": marketplace/index.md
        "data_catalog/metadata_datasets/south_spain_valencia.md": marketplace/index.md
        documentation/index.md: guides/index.md
        documentation/verifiable_credentials/index.md: guides/wallet.md
        documentation/verifiable_credentials/keycloak/index.md: guides/deploy_connector.md
        documentation/trust_frameworks/index.md: data_spaces/fiware.md
        documentation/trust_frameworks/fiware_trust_anchor/index.md: data_spaces/fiware.md
        documentation/data_space_connectors/index.md: data_spaces/index.md
        documentation/data_space_connectors/fiware/index.md: data_spaces/fiware.md
        documentation/data_space_connectors/eclipse/index.md: data_spaces/eclipse/index.md
        documentation/data_federation/index.md: toolbox/lepus.md
        documentation/data_federation/ngsiv2_to_ld/lepus.md: toolbox/lepus.md
        documentation/data_federation/ngsiv2_to_ld/iot_agent.md: toolbox/iot_agent.md
        documentation/mv_data_space/index.md: data_spaces/index.md
        documentation/mv_data_space/fiware/trust_anchor.md: guides/deploy_connector.md
        documentation/mv_data_space/fiware/consumer.md: guides/deploy_connector.md
        documentation/mv_data_space/fiware/provider.md: guides/deploy_connector.md
        documentation/mv_data_space/eclipse/index.md: data_spaces/eclipse/index.md
        documentation/mv_data_space/eclipse/architecture.md: data_spaces/eclipse/architecture.md
        documentation/mv_data_space/eclipse/deployment.md: data_spaces/eclipse/deployment.md
        documentation/local_digital_twins/index.md: local_digital_twins/index.md
        documentation/ai_assessment/index.md: ai_assessment/index.md
        documentation/ai_assessment/ai_assessment_catalogue.md: ai_assessment/ai_assessment_catalogue.md
        services/index.md: marketplace/index.md
        services/waste_collection.md: miais/index.md
        services/GenAI-MVP.md: marketplace/index.md
        services/healthy_routes.md: marketplace/index.md
        services/wastecontainer_location_optimization.md: marketplace/index.md
        resources/index.md: tef/index.md
        data_spaces/bridge.md: valencia/index.md#the-same-data-in-the-eclipse-edc-data-space
extra:
  generator: false
  marketplace_url: https://marketplace.citcom-vrain-dataspace.eu
  hidden_sections:
    - Help
  labels:
    data_brokers:
      fiware: '<span class="cc-chip cc-chip--broker">FIWARE</span>'
      kafka: '<span class="cc-chip cc-chip--broker">Kafka</span>'
      iot_ticket: '<span class="cc-chip cc-chip--broker">IoT-Ticket Azure</span>'
    api_brokers:
      ngsi_v2: '<span class="cc-chip cc-chip--v2">NGSI-v2</span>'
      ngsi_ld: '<span class="cc-chip cc-chip--ld">NGSI-LD</span>'
      custom: '<span class="cc-chip cc-chip--custom">Custom</span>'
    ds4ssc_compliant:
      yes_comp:
        data_sources: '<span class="cc-chip cc-chip--yes">Data Sources</span>'
        data_broker: '<span class="cc-chip cc-chip--yes">Data Broker</span>'
        data_api: '<span class="cc-chip cc-chip--yes">Data API</span>'
        data_idm_auth: '<span class="cc-chip cc-chip--yes">IdM &amp; Auth</span>'
        data_publication: '<span class="cc-chip cc-chip--yes">Data Publication</span>'
      no_comp:
        data_sources: '<span class="cc-chip cc-chip--no">Data Sources</span>'
        data_broker: '<span class="cc-chip cc-chip--no">Data Broker</span>'
        data_api: '<span class="cc-chip cc-chip--no">Data API</span>'
        data_idm_auth: '<span class="cc-chip cc-chip--no">IdM &amp; Auth</span>'
        data_publication: '<span class="cc-chip cc-chip--no">Data Publication</span>'