# External links checked every week by .github/workflows/links.yml (internal links are checked
# by every build). https://lychee.cli.rs/usage/config/

# Only links to other sites
scheme = ["https", "http"]
include_verbatim = false

# Some sites answer automated clients with 403 or 429 although the page exists
accept = ["200..=299", "403", "429"]
max_retries = 3
timeout = 30

exclude = [
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  "^https?://([a-z0-9-]+\\.)*example\\.(org|com|net)",
  # Sites that refuse automated clients
  "^https?://(www\\.)?linkedin\\.com",
]
exclude_path = ["docs/overrides", "docs/assets/vendor"]
